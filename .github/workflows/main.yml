name: Build Android APKs

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: 'සේවාදායකයේ ලිපිනය (public/ ෆෝල්ඩරය), උදා: https://tuition.example.lk/public/'
        required: false
        type: string
  push:
    tags: ['v*']

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses (SDK is preinstalled on the runner)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Decode keystore (optional)
        if: env.KS_B64 != ''
        run: |
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build staff + portal APKs
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          BASE="${{ inputs.base_url || vars.BASE_URL }}"
          if [ -z "$BASE" ]; then BASE="$(grep '^BASE_URL=' gradle.properties | cut -d= -f2-)"; fi
          echo "Using BASE_URL=$BASE"
          gradle assembleStaffRelease assemblePortalRelease -PBASE_URL="$BASE" -PAPP_VERSION_CODE="${{ github.run_number }}" --no-daemon

      - name: Collect APKs
        run: |
          mkdir -p out
          cp app/build/outputs/apk/staff/release/*.apk out/tuition-staff.apk
          cp app/build/outputs/apk/portal/release/*.apk out/student-portal.apk

      - uses: actions/upload-artifact@v4
        with:
          name: tuition-apks
          path: out/*.apk

      - name: Attach to release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
